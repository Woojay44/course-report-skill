# 示例默认值。用自己的署名时：复制本文件为 defaults.local.yaml（不进 git）再改，脚本优先读它。
# 封面的姓名、学号、写作日期从这里取；md 的 front matter 里写同名字段可覆盖。
name: 张三
student_id: "2024000000000"
# 写作日期（date: auto）按此时区取当天
timezone: Asia/Taipei
# 可选：学校、课程，留空则封面不显示
org: ""
course: ""
# 课程是否硬性要求宋体/黑体。true：默认走 docx，交付 docx，由本机 Word 导出 PDF
font_strict: true
# 标题编号：cn（一、（一）1.）| decimal（1、1.1）| manual（标题里自己写编号）
numbering: cn
# 页码：roman（目录/摘要罗马数字，正文从 1）| continuous（封面计 1 页不显示，其后连续）
page_numbers: roman
